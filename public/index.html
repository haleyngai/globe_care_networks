<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Haley's Comets · Global</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap');

  :root {
    --bg: #020508;
    --accent1: #00d4ff;
    --accent2: #ff6eb4;
    --text: #e8f4f8;
    --muted: rgba(232,244,248,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 24px 32px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .brand { display: flex; flex-direction: column; gap: 2px; }

  .brand-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 300;
    letter-spacing: 0.12em;
  }

  .brand-sub {
    font-size: 10px;
    font-weight: 200;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #stats { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px;
    padding: 6px 14px;
    transition: opacity 0.8s;
  }

  .stat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent1);
    box-shadow: 0 0 8px var(--accent1);
    animation: pulse 2s ease-in-out infinite;
  }

  .stat-text { font-size: 11px; font-weight: 300; letter-spacing: 0.15em; }
  .stat-num  { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 300; color: var(--accent1); }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.5; transform:scale(.8); }
  }

  /* Connection status badge */
  #status-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 18px 32px;
    text-align: center;
    transition: opacity 0.6s ease;
  }
  #status-badge.hidden { opacity: 0; pointer-events: none; }
  #status-badge .sb-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  #status-badge .sb-sub {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot-spin {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent1);
    box-shadow: 0 0 10px var(--accent1);
    animation: pulse 1s ease-in-out infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  #hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: opacity 0.8s ease;
  }
  #hint.hidden { opacity: 0; pointer-events: none; }

  .hint-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    animation: float 3s ease-in-out infinite;
  }
  .hint-icon svg { opacity: 0.6; }
  .hint-text { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  #connections-label {
    position: absolute;
    bottom: 32px; right: 32px;
    text-align: right;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #connections-label.visible { opacity: 1; }

  .conn-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 300;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .conn-label { font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  /* "Someone joined" toast */
  #toast {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    animation: ripple-out 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  @keyframes ripple-out {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.8; }
    100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
  }

  @media (max-width: 600px) {
    #header { padding: 16px 20px; }
    #hint, #connections-label { bottom: 20px; }
    #connections-label { right: 20px; }
  }
</style>
</head>
<body>

<canvas id="globe"></canvas>

<div id="ui">
  <div id="header">
    <div class="brand">
      <div class="brand-title">Care Network</div>
      <div class="brand-sub">Global Human Connection</div>
    </div>
    <div id="stats">
      <div class="stat-row">
        <div class="stat-dot"></div>
        <span class="stat-text">Souls connected</span>
        <span class="stat-num" id="people-count">0</span>
      </div>
      <div class="stat-row" id="bonds-row" style="opacity:0;">
        <div class="stat-dot" style="background:var(--accent2);box-shadow:0 0 8px var(--accent2);"></div>
        <span class="stat-text">Connections</span>
        <span class="stat-num" id="bonds-count" style="color:var(--accent2);">0</span>
      </div>
      <div class="stat-row" id="viewers-row" style="opacity:0;">
        <div class="stat-dot" style="background:#ffe566;box-shadow:0 0 8px #ffe566;animation-delay:0.5s;"></div>
        <span class="stat-text">Watching now</span>
        <span class="stat-num" id="viewers-count" style="color:#ffe566;">1</span>
      </div>
    </div>
  </div>

  <!-- Connecting overlay -->
  <div id="status-badge">
    <div class="sb-title"><span class="dot-spin"></span>Connecting…</div>
    <div class="sb-sub">Reaching the network</div>
  </div>

  <div id="hint" class="hidden">
    <div class="hint-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M12 8v8M8 12h8"/>
      </svg>
    </div>
    <div class="hint-text">Touch to join the network</div>
  </div>

  <div id="connections-label">
    <div class="conn-num" id="conn-num">0</div>
    <div class="conn-label">Connections made</div>
  </div>

  <div id="toast"></div>
</div>

<!-- Three.js + Socket.io -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
// ─── COLORS ───────────────────────────────────────────────────────────────────
const COLORS = [
  0x00d4ff, 0xff6eb4, 0xffe566, 0x7dffb3, 0xc084fc,
  0xff9f43, 0x54a0ff, 0xff6b6b, 0x1dd1a1, 0xfeca57
];
const COLORS_CSS = [
  '#00d4ff','#ff6eb4','#ffe566','#7dffb3','#c084fc',
  '#ff9f43','#54a0ff','#ff6b6b','#1dd1a1','#feca57'
];

// ─── SCENE ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 2.8;

scene.add(new THREE.AmbientLight(0x112233, 1.2));
const dirLight = new THREE.DirectionalLight(0x00d4ff, 0.6);
dirLight.position.set(5, 3, 5); scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0xff6eb4, 0.3);
rimLight.position.set(-5, -2, -3); scene.add(rimLight);

// Starfield
function makeStarLayer(count, rMin, rMax, size, opacity) {
  const geo = new THREE.BufferGeometry();
  const v = [];
  for (let i = 0; i < count; i++) {
    const r = rMin + Math.random() * (rMax - rMin);
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    v.push(r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color:0xffffff, size, transparent:true, opacity, sizeAttenuation:true }));
}
scene.add(makeStarLayer(8000, 60, 100, 0.04, 0.55));
scene.add(makeStarLayer(4000, 40,  70, 0.07, 0.45));
scene.add(makeStarLayer(1500, 25,  50, 0.10, 0.35));

// Globe group — everything rotates together
const globeGroup = new THREE.Group();
scene.add(globeGroup);

const RADIUS = 1.0;
globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, 64, 64),
  new THREE.MeshPhongMaterial({ color:0x0a1628, emissive:0x001833, specular:0x00d4ff, shininess:80, transparent:true, opacity:0.92 })
));
globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS+0.002, 36, 18),
  new THREE.MeshBasicMaterial({ color:0x00d4ff, wireframe:true, transparent:true, opacity:0.06 })
));
globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS+0.04, 64, 64),
  new THREE.MeshPhongMaterial({ color:0x003366, emissive:0x001122, transparent:true, opacity:0.25, side:THREE.BackSide })
));
const outerMat = new THREE.MeshBasicMaterial({ color:0x00d4ff, transparent:true, opacity:0.04, side:THREE.BackSide });
globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(RADIUS+0.12, 64, 64), outerMat));

// Invisible hit sphere for raycasting
const hitSphere = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, 32, 32),
  new THREE.MeshBasicMaterial({ visible:false })
);
globeGroup.add(hitSphere);

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function latLonToLocal(lat, lon) {
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -Math.sin(phi) * Math.cos(theta),
     Math.cos(phi),
     Math.sin(phi) * Math.sin(theta)
  );
}

function makeStar4(size) {
  const shape = new THREE.Shape();
  const outer = size, inner = size * 0.35, pts = 4;
  for (let i = 0; i < pts*2; i++) {
    const r = (i%2===0) ? outer : inner;
    const a = (i/(pts*2)) * Math.PI*2 - Math.PI/2;
    if (i===0) shape.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    else        shape.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  shape.closePath();
  return new THREE.ShapeGeometry(shape);
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let people      = [];   // ordered list of rendered persons
let connections = [];

// ─── RENDER A TAP (called both on init history replay and live events) ─────────
function renderTap(tap) {
  const { lat, lon, colorIdx } = tap;
  const color    = COLORS[colorIdx % COLORS.length];
  const colorCSS = COLORS_CSS[colorIdx % COLORS_CSS.length];

  const localDir   = latLonToLocal(lat, lon);
  const surfacePos = localDir.clone().multiplyScalar(RADIUS + 0.012);
  const up   = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, localDir);

  // Star
  const star = new THREE.Mesh(makeStar4(0.032), new THREE.MeshBasicMaterial({ color, side:THREE.DoubleSide }));
  star.position.copy(surfacePos);
  star.setRotationFromQuaternion(quat);
  globeGroup.add(star);

  // Glow
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.25, side:THREE.DoubleSide });
  const glow = new THREE.Mesh(makeStar4(0.06), glowMat);
  glow.position.copy(surfacePos);
  glow.setRotationFromQuaternion(quat);
  globeGroup.add(glow);

  const person = { lat, lon, localDir, surfacePos, color, colorCSS, star, glow, baseQuat:quat.clone(), birthTime:Date.now() };
  people.push(person);

  // Connect to previous
  if (people.length >= 2) renderArc(person, people[people.length - 2]);

  updateUI();
  return person;
}

// ─── RENDER ARC ───────────────────────────────────────────────────────────────
function renderArc(a, b) {
  const posA = a.surfacePos, posB = b.surfacePos;
  const dist = posA.distanceTo(posB);
  const arcH = Math.min(0.05 + dist * 0.12, 0.28);
  const N = 60;
  const pts = [];

  for (let i = 0; i <= N; i++) {
    const t = i / N;
    if (i===0) { pts.push(posA.clone()); continue; }
    if (i===N) { pts.push(posB.clone()); continue; }

    const dA = a.localDir, dB = b.localDir;
    const dot = Math.max(-1, Math.min(1, dA.dot(dB)));
    const omega = Math.acos(dot);
    let dir;
    if (Math.abs(omega) < 0.0001) {
      dir = dA.clone();
    } else {
      const sinO = Math.sin(omega);
      dir = dA.clone().multiplyScalar(Math.sin((1-t)*omega)/sinO)
            .add(dB.clone().multiplyScalar(Math.sin(t*omega)/sinO));
    }
    pts.push(dir.normalize().multiplyScalar(RADIUS + 0.012 + arcH * Math.sin(Math.PI*t)));
  }

  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const cA = new THREE.Color(a.color), cB = new THREE.Color(b.color);
  const cols = [];
  for (let i = 0; i <= N; i++) { const c = cA.clone().lerp(cB, i/N); cols.push(c.r,c.g,c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));

  const mat  = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0 });
  const line = new THREE.Line(geo, mat);
  globeGroup.add(line);
  connections.push({ line, mat, birthTime:Date.now() });

  setTimeout(() => playConnectionSound(colorIdx), 80);
}

// ─── AUDIO ────────────────────────────────────────────────────────────────────
let audioCtx = null;
let colorIdx = 0; // local counter just for audio pitch variety

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playConnectionSound(ci) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const pentatonic = [0,2,4,7,9,12,14,16,19,21];
  const semi = pentatonic[ci % pentatonic.length];
  const baseFreq = 220 * Math.pow(2, semi/12);

  const hpf = ctx.createBiquadFilter();
  hpf.type = 'highpass'; hpf.frequency.value = 180;
  hpf.connect(ctx.destination);

  const master = ctx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.11, now+0.02);
  master.gain.exponentialRampToValueAtTime(0.001, now+2.2);
  master.connect(hpf);

  [[baseFreq,1],[baseFreq*2,0.32],[baseFreq*1.5,0.16]].forEach(([freq, vol], li) => {
    const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, now+li*0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now+2.0-li*0.2);
    o.connect(g); g.connect(master);
    o.start(now+li*0.02); o.stop(now+2.2);
  });

  // Vibrato on fundamental
  const vib = ctx.createOscillator(); vib.frequency.value = 5.5;
  const vibG = ctx.createGain(); vibG.gain.value = 1.8;
  vib.connect(vibG); vib.start(now); vib.stop(now+2.2);
}

function playArrivalSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const o = ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(880, now);
  o.frequency.exponentialRampToValueAtTime(440, now+0.3);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.07, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.5);
  o.connect(g); g.connect(ctx.destination);
  o.start(now); o.stop(now+0.5);
}

// ─── UI ───────────────────────────────────────────────────────────────────────
let toastTimer = null;

function updateUI() {
  document.getElementById('people-count').textContent = people.length;
  document.getElementById('bonds-count').textContent  = connections.length;
  document.getElementById('conn-num').textContent     = connections.length;
  if (people.length > 0) document.getElementById('hint').classList.remove('hidden');
  if (connections.length > 0) {
    document.getElementById('bonds-row').style.opacity = '1';
    document.getElementById('connections-label').classList.add('visible');
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function setViewers(n) {
  document.getElementById('viewers-count').textContent = n;
  document.getElementById('viewers-row').style.opacity = '1';
}

// ─── SOCKET.IO ────────────────────────────────────────────────────────────────
const socket = io();

socket.on('connect', () => {
  console.log('Connected:', socket.id);
  document.getElementById('status-badge').classList.add('hidden');
  document.getElementById('hint').classList.remove('hidden');
});

socket.on('disconnect', () => {
  document.getElementById('status-badge').classList.remove('hidden');
  document.getElementById('status-badge').querySelector('.sb-title').innerHTML =
    '<span class="dot-spin" style="background:#ff6b6b;box-shadow:0 0 10px #ff6b6b"></span>Reconnecting…';
});

// Receive full history on first connect — replay silently
socket.on('init', ({ taps, totalClients }) => {
  taps.forEach(tap => renderTap(tap));
  setViewers(totalClients);
  if (taps.length === 0) {
    document.getElementById('hint').classList.remove('hidden');
  }
});

// Live tap from any client
socket.on('tap', (tap) => {
  renderTap(tap);
  playArrivalSound();
  colorIdx++;
  if (tap.id && !tap.id.startsWith(socket.id)) {
    // It's from another user — show toast
    showToast('✦ someone joined the network');
    // Ripple in center to signal remote join
    spawnRipple(window.innerWidth/2, window.innerHeight/2, COLORS_CSS[tap.colorIdx % COLORS_CSS.length]);
  }
});

// Viewer count update
socket.on('viewers', (n) => setViewers(n));

// ─── INTERACTION ──────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let dragDelta   = 0;

function getEventPos(e) {
  if (e.touches && e.touches.length > 0) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}

function handleInteraction(e) {
  if (dragDelta > 6) return;

  const { x, y } = getEventPos(e);
  mouse.x =  (x / window.innerWidth)  * 2 - 1;
  mouse.y = -(y / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(hitSphere);

  let lat, lon;
  if (hits.length > 0) {
    const lp = globeGroup.worldToLocal(hits[0].point.clone()).normalize();
    lat = 90 - Math.acos(Math.max(-1, Math.min(1, lp.y))) * 180 / Math.PI;
    lon = Math.atan2(lp.z, -lp.x) * 180 / Math.PI - 180;
  } else {
    lat = Math.asin(2*Math.random()-1) * 180/Math.PI;
    lon = 360*Math.random()-180;
  }

  // Emit to server — server will broadcast back to ALL clients including us
  socket.emit('tap', { lat, lon });
  spawnRipple(x, y, COLORS_CSS[people.length % COLORS_CSS.length]);
}

function spawnRipple(x, y, color) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.cssText = `left:${x}px;top:${y}px;width:40px;height:40px;border:1.5px solid ${color};box-shadow:0 0 20px ${color};`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

canvas.addEventListener('click', handleInteraction);
canvas.addEventListener('touchstart', e => { e.preventDefault(); dragDelta=0; handleInteraction(e); }, { passive:false });

// ─── ZOOM ─────────────────────────────────────────────────────────────────────
const ZOOM_MIN = 1.4, ZOOM_MAX = 8.0;
let targetZ = camera.position.z;
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetZ = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZ + e.deltaY*0.004));
}, { passive:false });

// ─── DRAG ROTATE ──────────────────────────────────────────────────────────────
let isDragging = false, prevDrag = {x:0,y:0}, rotVel = {x:0,y:0};

canvas.addEventListener('mousedown', e => { isDragging=true; dragDelta=0; prevDrag={x:e.clientX,y:e.clientY}; rotVel={x:0,y:0}; });
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx=e.clientX-prevDrag.x, dy=e.clientY-prevDrag.y;
  dragDelta += Math.abs(dx)+Math.abs(dy);
  rotVel={x:dy*0.005, y:dx*0.005};
  globeGroup.rotation.x+=rotVel.x; globeGroup.rotation.y+=rotVel.y;
  prevDrag={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('mouseup',    () => isDragging=false);
canvas.addEventListener('mouseleave', () => isDragging=false);

let touchStart=null, pinchDist0=null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchDist0=Math.sqrt(dx*dx+dy*dy); touchStart=null;
  } else { touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; pinchDist0=null; dragDelta=0; }
}, { passive:true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length===2 && pinchDist0!==null) {
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    targetZ=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,targetZ+(pinchDist0-d)*0.018));
    pinchDist0=d;
  } else if (e.touches.length===1 && touchStart) {
    const dx=e.touches[0].clientX-touchStart.x, dy=e.touches[0].clientY-touchStart.y;
    dragDelta+=Math.abs(dx)+Math.abs(dy);
    if (dragDelta>8) {
      globeGroup.rotation.y+=dx*0.005; globeGroup.rotation.x+=dy*0.005;
      touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    }
  }
}, { passive:true });

// ─── ANIMATE ──────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  camera.position.z += (targetZ - camera.position.z) * 0.08;

  if (!isDragging) {
    globeGroup.rotation.y += 0.0015;
    rotVel.x *= 0.92; rotVel.y *= 0.92;
    globeGroup.rotation.x += rotVel.x * 0.5;
  }

  people.forEach((p, i) => {
    const spin  = new THREE.Quaternion().setFromAxisAngle(p.localDir, elapsed*0.4+i*0.7);
    p.star.setRotationFromQuaternion(spin.multiply(p.baseQuat.clone()));
    const spinG = new THREE.Quaternion().setFromAxisAngle(p.localDir, elapsed*0.25+i);
    p.glow.setRotationFromQuaternion(spinG.multiply(p.baseQuat.clone()));
    p.glow.material.opacity = 0.12 + 0.15*Math.sin(elapsed*2+i);
  });

  connections.forEach((c, i) => {
    const age = (Date.now()-c.birthTime)/1000;
    c.mat.opacity = Math.min(age*1.5, 0.55+0.08*Math.sin(elapsed*1.2+i));
  });

  outerMat.opacity = 0.03 + 0.015*Math.sin(elapsed*0.7);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
